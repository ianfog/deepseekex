name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        run: npm run dist:win -- --publish never

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Deepseekex-*.exe
            dist/Deepseekex-*.exe.blockmap
            dist/latest.yml
          fail_on_unmatched_files: false
          generate_release_notes: true

  build-mac:
    runs-on: macos-latest
    # macOS auto-update (Squirrel.Mac via electron-updater) REQUIRES the app to
    # be code-signed with a Developer ID certificate; notarization is applied
    # automatically by electron-builder when the APPLE_* vars are present
    # (mac.notarize = true in package.json). Without these secrets the build
    # falls back to unsigned (auto-update stays unavailable) but CI succeeds.
    # Required secrets:
    #   MAC_CSC_LINK              base64 of the Developer ID Application .p12
    #   MAC_CSC_KEY_PASSWORD      password of the .p12
    #   APPLE_ID                  Apple account used for notarization
    #   APPLE_APP_SPECIFIC_PASSWORD  app-specific password for that account
    #   APPLE_TEAM_ID             Developer team id
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate macOS icon (icns from png)
        run: |
          set -e
          mkdir -p build/icon.iconset
          sips -z 16 16 build/icon.png --out build/icon.iconset/icon_16x16.png
          sips -z 32 32 build/icon.png --out build/icon.iconset/icon_16x16@2x.png
          sips -z 32 32 build/icon.png --out build/icon.iconset/icon_32x32.png
          sips -z 64 64 build/icon.png --out build/icon.iconset/icon_32x32@2x.png
          sips -z 128 128 build/icon.png --out build/icon.iconset/icon_128x128.png
          sips -z 256 256 build/icon.png --out build/icon.iconset/icon_128x128@2x.png
          sips -z 256 256 build/icon.png --out build/icon.iconset/icon_256x256.png
          sips -z 512 512 build/icon.png --out build/icon.iconset/icon_256x256@2x.png
          sips -z 512 512 build/icon.png --out build/icon.iconset/icon_512x512.png
          cp build/icon.png build/icon.iconset/icon_512x512@2x.png
          iconutil -c icns build/icon.iconset -o build/icon.icns

      - name: Build installer
        run: |
          set -e
          # Export signing/notarization vars ONLY when the secrets are actually
          # configured. GitHub substitutes unset secrets with an empty string,
          # and electron-builder treats CSC_LINK="" as a configured-but-empty
          # cert path (getCscLink keeps ""), which makes mac packaging fail
          # with "<projectDir> not a file" during certificate import. Leaving
          # the vars unset falls back to an unsigned build; notarize:true is
          # skipped when no APPLE_* vars are present.
          if [ -n "${{ secrets.MAC_CSC_LINK }}" ]; then
            export CSC_LINK="${{ secrets.MAC_CSC_LINK }}"
            export CSC_KEY_PASSWORD="${{ secrets.MAC_CSC_KEY_PASSWORD }}"
          fi
          if [ -n "${{ secrets.APPLE_ID }}" ]; then
            export APPLE_ID="${{ secrets.APPLE_ID }}"
            export APPLE_APP_SPECIFIC_PASSWORD="${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}"
            export APPLE_TEAM_ID="${{ secrets.APPLE_TEAM_ID }}"
          fi
          npm run dist:mac -- --x64 --arm64 --publish never

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/latest-mac.yml
            dist/Deepseekex-*.dmg
            dist/Deepseekex-*.zip
          fail_on_unmatched_files: false
          generate_release_notes: true
